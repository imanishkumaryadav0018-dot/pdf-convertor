<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>PDF to JPG</title>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/pdf.js/3.11.174/pdf.min.js"></script>
  <style>
    * { box-sizing: border-box; font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; }
    body { margin: 0; padding: 20px; background: #0f172a; color: #f8fafc; }
    .card { background: #1e293b; padding: 20px; border-radius: 12px; max-width: 480px; margin: 0 auto; }
    h1 { font-size: 1.25rem; margin-top: 0; text-align: center; }
    .upload-box { border: 2px dashed #475569; border-radius: 8px; padding: 24px 16px; text-align: center; margin-bottom: 16px; }
    input[type="file"] { display: none; }
    label.btn, button { display: block; width: 100%; text-align: center; background: #2563eb; color: #fff; padding: 12px; border: none; border-radius: 8px; font-size: 1rem; font-weight: 600; cursor: pointer; }
    button:disabled { background: #475569; cursor: not-allowed; }
    #status { margin: 12px 0; font-size: 0.9rem; text-align: center; color: #94a3b8; }
    .output-grid { display: flex; flex-direction: column; gap: 16px; margin-top: 16px; }
    .page-preview { background: #334155; padding: 12px; border-radius: 8px; text-align: center; }
    .page-preview img { max-width: 100%; height: auto; border-radius: 4px; display: block; margin: 8px auto; }
    .dl-btn { background: #10b981; text-decoration: none; display: inline-block; padding: 8px 16px; border-radius: 6px; color: white; font-weight: 600; }
  </style>
</head>
<body>
  <div class="card">
    <h1>PDF to JPG Converter</h1>
    <div class="upload-box">
      <input type="file" id="pdfInput" accept="application/pdf" />
      <label for="pdfInput" class="btn">Select PDF</label>
      <div id="status">No file chosen</div>
    </div>
    <div id="output" class="output-grid"></div>
  </div>

  <script>
    pdfjsLib.GlobalWorkerOptions.workerSrc = 'https://cdnjs.cloudflare.com/ajax/libs/pdf.js/3.11.174/pdf.worker.min.js';

    const input = document.getElementById('pdfInput');
    const status = document.getElementById('status');
    const output = document.getElementById('output');

    input.addEventListener('change', async (e) => {
      const file = e.target.files[0];
      if (!file) return;

      output.innerHTML = '';
      status.innerText = 'Reading file...';

      const arrayBuffer = await file.arrayBuffer();
      const pdf = await pdfjsLib.getDocument({ data: arrayBuffer }).promise;
      status.innerText = `Converting ${pdf.numPages} page(s)...`;

      for (let pageNum = 1; pageNum <= pdf.numPages; pageNum++) {
        const page = await pdf.getPage(pageNum);
        const viewport = page.getViewport({ scale: 2.0 }); // High-DPI scale for sharp JPGs

        const canvas = document.createElement('canvas');
        const context = canvas.getContext('2d');
        canvas.height = viewport.height;
        canvas.width = viewport.width;

        await page.render({ canvasContext: context, viewport }).promise;

        const jpgUrl = canvas.toDataURL('image/jpeg', 0.92);

        const container = document.createElement('div');
        container.className = 'page-preview';
        container.innerHTML = `
          <strong>Page ${pageNum}</strong>
          <img src="${jpgUrl}" alt="Page ${pageNum}" />
          <a href="${jpgUrl}" download="page-${pageNum}.jpg" class="dl-btn">Save Page ${pageNum}</a>
        `;
        output.appendChild(container);
      }

      status.innerText = `Done! Converted ${pdf.numPages} page(s).`;
    });
  </script>
</body>
</html>
